[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-macro-indicators"
version = "0.1.0"
description = "Public macroeconomic indicators, country trends, and relational analytics"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
econpipe = "econpipe.cli:main"

[tool.setuptools.packages.find]
include = ["econpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
