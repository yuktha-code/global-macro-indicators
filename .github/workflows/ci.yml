name: Macro indicators validation
on:
  push:
  pull_request:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Offline end-to-end demo and idempotent rerun
        run: |
          python -m econpipe.cli demo --db-url sqlite:///data/demo.sqlite --output results/demo_run_1.json
          python -m econpipe.cli demo --db-url sqlite:///data/demo.sqlite --output results/demo_run_2.json
          python -c "import json; d=json.load(open('results/demo_run_2.json')); assert d['inserted']==0 and d['updated']==0 and d['fk_orphan_rows']==0"
