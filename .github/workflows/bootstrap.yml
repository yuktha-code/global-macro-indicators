name: Import macro indicator project sources
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-sources:
    if: github.event.head_commit.message == 'Start source import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore locally verified project sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, base64, lzma, hashlib, io, tarfile, urllib.request
          from pathlib import Path
          blob_sha = '809fdf8e249df00f02a23702109696391b4688f8'
          url = 'https://api.github.com/repos/yuktha-code/global-macro-indicators/git/blobs/' + blob_sha
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'github-actions-public-data-repo-setup',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              obj = json.load(response)
          payload = base64.b64decode(obj['content'])
          sha = hashlib.sha1(b'blob ' + str(len(payload)).encode() + b'\x00' + payload).hexdigest()
          if sha != blob_sha:
              raise RuntimeError('Archived source integrity verification failed')
          archive_bytes = lzma.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode='r:') as tar:
              for entry in tar.getmembers():
                  path = Path(entry.name)
                  if path.is_absolute() or '..' in path.parts or not entry.isfile():
                      raise RuntimeError('Unsafe archive entry: ' + entry.name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  data = tar.extractfile(entry).read()
                  path.write_bytes(data)
          Path('.github/workflows/ci.yml').unlink(missing_ok=True)
          print('Restored checksum-verified project sources')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Publish public macroeconomic data pipeline sources and offline tests'
          git push
